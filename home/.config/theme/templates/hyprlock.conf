# The fallback lock screen (quickshell/scripts/lock, when the shell does not answer); the shell's own
# (quickshell/lock/Lock.qml) looks the same: the plain look, night colours, no picture.
# Stock config: hyprlock.conf.bak-default
# Sizes are points (4/3 of a pixel): 54 and 10 here match the 72 px clock and 13 px text there.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = @desk_rgba@
}

# Clock
label {
    monitor =
    text = $TIME
    color = @fg_strong_rgba@
    font_size = 54
    font_family = JetBrainsMono Nerd Font Light
    position = 0, 103
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date '+%A, %d. %B'
    color = @dim_rgba@
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = @fg_rgba@
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -21
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 32
    rounding = 0
    outline_thickness = 1
    outer_color = @primary_rgba@
    inner_color = @field_rgba@
    font_color = @fg_rgba@
    font_family = JetBrainsMono Nerd Font
    check_color = @primary_rgba@
    fail_color = @red_rgba@
    capslock_color = @orange_rgba@
    fade_on_empty = false
    placeholder_text = <span foreground="##@faint_hex@">Password</span>
    fail_text = <span foreground="##@red_hex@">wrong</span>
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = false
    dots_rounding = 0
    position = 0, -52
    halign = center
    valign = center
}
