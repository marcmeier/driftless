# Locking goes through the shell's lock screen (quickshell/lock/Lock.qml); scripts/lock falls back to
# hyprlock when the shell does not answer. "loginctl lock-session" (sleep, the timeout) calls lock_cmd.
# The times (seconds) are this machine's choice in the settings (Power), written by
# quickshell/scripts/prefs.py; hypridle.service.d creates the file empty before the first choice.
$lock_after = 600
$screen_off_after = 900
source = ~/.local/state/hypr/idle.conf

general {
    lock_cmd = ~/.config/quickshell/scripts/lock
    before_sleep_cmd = loginctl lock-session
}
listener {
    timeout = $lock_after
    on-timeout = loginctl lock-session
}

listener {
    timeout = $screen_off_after
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
