# hypridle.conf sources the idle times from the settings (quickshell/scripts/prefs.py): the file has
# to be there, also before the first choice, or hypridle logs a config error at every start
[Service]
ExecStartPre=/usr/bin/mkdir -p %h/.local/state/hypr
ExecStartPre=/usr/bin/touch %h/.local/state/hypr/idle.conf
