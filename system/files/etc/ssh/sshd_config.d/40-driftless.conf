# driftless: SSH on every machine, with keys only and never as root. The keys that may log in are in
# ~/.ssh/authorized_keys of each machine, kept by hand (they never travel with the repository).
# sshd takes the first value it reads: this file comes before 99-archlinux.conf.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
